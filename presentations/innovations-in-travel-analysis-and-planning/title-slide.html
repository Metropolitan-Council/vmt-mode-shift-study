
<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
  <p class="author">$author$</p>
$endfor$
$for(institute)$
  <p class="institute">$institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$

<div class="r-stack">
  <div class="metcouncil-logos">
    <img src="images/met-council-logo.png" alt="Metropolitan Council" />
    <img src="images/UK Lockup-blueweb.png" alt="University of Kentucky" />
    <img src="images/UNC_logo_RGB.png" />
  </div>
</div>

</section>
