# format of defining new steps:
# name: the name of the step
# inputs: a dictionary mapping the things that the step needs (on the left) to the actual column satisfying that (on the right)
# transformation (optional): the function to apply to the inputs as the actual input to the step
# the transformation should be defined as a static method returning a lambda in the step class definition
feasible_steps: 
    WalkDistanceStep:
      distance: walk_distance_rerouted
    BikeDistanceStep:
      distance: bike_distance_rerouted
    TransitReroutedStep:
      trip_rerouted: transit_rerouting_missing
    BikeSnowDepthStep:
      depth: snow_depth
    BikeHighLTSDistStep:
      lts3_distance: bike_distance_lts_3_rerouted
      lts4_distance: bike_distance_lts_4_rerouted
      distance: bike_distance_rerouted
    WalkTimingStep:
      duration: walk_duration_rerouted
      na_col: walk_rerouting_missing
    TransitTimingStep:
      duration: transit_duration_rerouted
      na_col: transit_rerouting_missing
    BikeTimingStep:
      duration: bike_duration_rerouted
      na_col: bike_rerouting_missing
    # TransitAccessDistanceStep:
    #   access_distance: transit_access_length_rerouted
    # TransitTransferCountStep:
    #   transfer_count: transit_num_transfers_rerouted

probable_steps: 
    WalkDurationDifferenceStep:
      car_duration: car_duration_rerouted
      walk_duration: walk_duration_rerouted
    BikeDurationDifferenceStep:
      car_duration: car_duration_rerouted
      bike_duration: bike_duration_rerouted
    TransitDurationDifferenceStep:
      car_duration: car_duration_rerouted
      transit_duration: transit_duration_rerouted
    BikeHighLTSDistStep:
      lts3_distance: bike_distance_lts_3_rerouted
      lts4_distance: bike_distance_lts_4_rerouted
    WalkPurposeStep:
      purpose: purpose_cleaned
    BikePurposeStep:
      purpose: purpose_cleaned
    TransitPurposeStep:
      purpose: purpose_cleaned
    TransitTransferCountStep:
      transfer_count: transit_num_transfers_rerouted
    WalkPrecipitationStep:
      precipitation: precipitation
    BikePrecipitationStep:
      precipitation: precipitation
    WalkTemperatureStep:
      temperature: temperature
    BikeTemperatureStep:
      temperature: temperature

fixed_purposes: ["Work", "Work-related", "Escort", "School", "School-related"]
unlikely_purposes: ["Escort", "Shop"]

build: False  # whether we are currently building to docker/streamlit; disables initialization/keyring
force_reinitialize: False  # whether to rebuild the input file (including scenarios)
# save_result: False

# assumed to be in data/ directory
community_shape_file_name: "shp_bdry_census2020counties_ctus/Census2020CTUs.shp"
tbi_file_name: "tbi_full.csv"  # must be parquet or csv
weather_file_name: "USW00014922.csv"
taz_terminal_time_file_name: "taz_terminal_times/TAZ3030_Terminal_times.shp"

# if you have defined a cleanup routine in a notebook, you can specify its (relative to project path) path here to run it 
# make sure the notebook exports the cleaned notebook as a parquet at the end using the same convention as output_file_name
# if you have not done this, just leave this empty
cleanup_notebook_path: 


# these are the columns to keep in the initialization process
# i.e., when the raw tbi cleaned data is read, only these columns are kept
# this prevents bloat later on
keep_columns:
    - mode
    - o_purpose_category
    - d_purpose_category
    - gender
    - age
    - student_status
    - job_type
    - num_kids
    - travel_date
    - home_lon
    - home_lat
    - income_detailed
    - duration
    - distance
    - person_id
    - trip_id
    - wave
    - depart_time
    - arrive_time
    - travel_dow
    - vmt
    - vehicle_trips
    - o_lat
    - o_lon
    - d_lat
    - d_lon
    - trip_weight

# all these mappings are needed for the tool to work correctly
# these map names of the TBI input into their according standardized column
# these are enforced after initialization 
# i.e., after initialization, there must be a df with these columns for the tool to work
# and the column names are standardized here for the rest of the tool
# these should not involve any personally identifiable data for anonymization
mappings:
    # sourced directly from TBI
    wave: wave  # TBI wave column 
    person_id: person_id  # column uniquely identifying people
    trip_id: trip_id  # column uniquely identifying the linked trip
    person_trips: person_trips  # column identifying the weighted number of person trips every trip
    vehicle_trips: vehicle_trips  # column identifying the weighted number of vehicle trips every trip
    travel_date: travel_date  # column for the date of travel; there is a foreign key relation where rerouted transit files reference these
    depart_time: depart_time  # column for travel departure time in format HH:MM:SS (str)
    arrive_time: arrive_time  # column for travel arrival time in format HH:MM:SS (str)
    duration: duration  # column for the duration of travel in minutes (numerical)
    distance: distance  # column for the distance of travel in miles (numerical)
    vehicle_trips: vehicle_trips  # column for the weighted vehicle trips a trip represents (numerical)
    vmt: vmt  # column for the weighted vmt a trip represents (numerical)
    mode: mode  # column for the mode of the trip -- this tool currently supports the consideration of car, transit, bike, and walk trips
    o_purpose_category: o_purpose_category  # column for the purpose category of the origin (why was the person in the origin)
    d_purpose_category: d_purpose_categrory  # column for the purpose category of the destination (why was the person going to the destination); the fixed/unlikely_purposes must involve these
    income_detailed: income_detailed  # column representing the income bracket a person is in

    # sourced from external files
    temperature: temperature  # column representing temperature during the trip in 1/10 degrees Celsius (numerical)
    precipitation: precipitation  # column represeting the amount of rainfall in 1/10 mm (numerical)
    snow_depth: snow_depth  # column represeting snow depth recorded on travel day in mm (numerical)
    CTU: CTU  # column representing the CTU a given started in

    # sourced from rerouted files
    car_distance_rerouted: car_distance_miles  # column representing the rerouted car distance in miles (numerical)
    car_duration_rerouted: car_duration_minutes_adj  # column representing the rerouted car duration in minutes (with terminal time included) (numerical)
    car_rerouting_missing: car_rerouting_missing  # column representing the column has an associated car rerouting (0/1)
    walk_duration_rerouted: walk_duration_minutes  # column representing the rerouted walk duration in minutes (numerical)
    walk_distance_rerouted: walk_distance_miles  # column representing the rerouted walk distance in miles (numerical)
    walk_rerouting_missing: walk_rerouting_missing  # column representing the column has an associated walk rerouting (0/1)
    bike_distance_rerouted: bike_distance_miles  # column representing the rerouted bike distance in miles (numerical)
    bike_distance_lts_1_rerouted: bike_distance_miles_1  # column representing the rerouted bike distance on LTS 1 in miles (numerical)
    bike_distance_lts_2_rerouted: bike_distance_miles_2  # column representing the rerouted bike distance on LTS 2 in miles (numerical)
    bike_distance_lts_3_rerouted: bike_distance_miles_3  # column representing the rerouted bike distance on LTS 3 in miles (numerical)
    bike_distance_lts_4_rerouted: bike_distance_miles_4  # column representing the rerouted bike distance on LTS 4 in miles (numerical)
    bike_duration_rerouted: bike_duration_minutes_adj  # column representing the rerouted bike duration in minutes (with terminal time included) (numerical)
    bike_rerouting_missing: bike_rerouting_missing  # column representing the column has an associated bike rerouting (0/1)
    transit_duration_rerouted: transit_duration  # column representing the rerouted transit duration in minutes (numerical)
    transit_rerouting_missing: transit_rerouting_missing  # column representing the column has an associated transit rerouting (0/1)
    transit_distance_rerouted: transit_length  # column representing the distance of the transit trip in miles (currently unused)
    transit_access_length_rerouted: transit_access_length  # column representing the rerouted access length of the transit trip in miles (currently unused)
    transit_num_transfers_rerouted: transit_num_transfers  # column representing the number of transfers in a transit trip
    transit_nontransit_duration_rerouted: transit_non_transit_duration  # column representing the non-transit duration (e.g., walk to stop) in minutes (currently unused)

    # derived columns
    transit_access_length: est_observed_transit_access_dist  # column representing the access length (to get to a stop) in miles for transit trips (currently unused)
    transit_num_transfers: transfers  # column reprsenting the number of transfers for transit trips (currently unused)
    purpose_cleaned: purpose_cleaned  # column representing the cleaned purpose of the trip (with origin purpose replacing destinaiton for home trips); for visualization/grouping
    person_type: person_type  # column representing the type of person this is (for visualization/grouping)
    gender_cleaned: gender_cleaned  # column representing the gender category this person falls into (for visualization/grouping)

scenarios:
    # these scenarios are assumed to just be the rerouting files but with different values
    bike:
        default:  # name of the scenario (for internal use)
          description: "Base Scenario"  # description of scenario
          # mappings of new columns merged into the dataframe, as done in the initialize script -> old columns they should replace in the base mappings described above; these should be compatible in terms of units
          # these new mapping columns (for the LHS) should have have "scenario" within them as a substring
          mappings:  
          file_path:  # file path to the rerouting
        best_bike:
          description: "Improve all streets to best bike LTS"
          mappings: 
            scenario_best_bike_distance_lts_3_rerouted: bike_distance_lts_3_rerouted
            scenario_best_bike_distance_lts_4_rerouted: bike_distance_lts_4_rerouted
            scenario_best_bike_distance_rerouted: bike_distance_rerouted
            scenario_best_bike_duration_rerouted: bike_duration_rerouted
          file_path: "/Data_Processed/geodata/bike-scenario-6df8c.parquet"
        ebike:
          description: "Take ebikes into consideration"
          mappings:
            scenario_best_bike_distance_lts_3_rerouted: bike_distance_lts_3_rerouted
            scenario_best_bike_distance_lts_4_rerouted: bike_distance_lts_4_rerouted
            scenario_best_bike_distance_rerouted: bike_distance_rerouted
            scenario_best_bike_duration_rerouted: bike_duration_rerouted
          file_path: "/Data_Processed/geodata/bike-ebike-8a1a0-1.parquet"
    transit:
        default:
          description: "Base Scenario"
          mappings:
          file_path:
        double_transit:
          description: "Double frequency of all transit routes"
          mappings:
            scenario_double_transit_duration_rerouted: transit_duration_rerouted
            scenario_double_transit_distance_rerouted: transit_distance_rerouted
            scenario_double_transit_rerouting_missing: transit_rerouting_missing
          file_path: "/Data_Processed/geodata/transit-scenario-93d71.parquet"
    walk:
        default:
          description: "Base Scenario"
          mappings:
          file_path:
        best_walk:
          description: "Walk scenario"
          key: trip_id
          mappings:
            scenario_best_walk_duration_rerouted: walk_duration_rerouted
            scenario_best_walk_distance_rerouted: walk_distance_rerouted
          file_path: "/Data_Processed/geodata/walk-scenario-a37e1.parquet"
    car:
        default:
          description: "Base Scenario"
          mappings:
          file_path:
        car_scenario:
          description: "Car Scenario"
          mappings:
            scenario_car_scenario_duration_rerouted: car_duration_rerouted
            scenario_car_scenario_distance_rerouted: car_distance_rerouted
          file_path: "/Data_Processed/geodata/car_scenario/car_scenario_nogeom.parquet"

cold_start_threshold: 15

# This is the cleaned TBI file, as input to the whole process. 
# it is on the network drive, as specified in the keyring variable.
input_tbi_file: "/data_processed/tbi_cleaned.csv"


# These is are the routes for each TBI trip.  To change the scenario, change these. 
# it is on the network drive, as specified in the keyring variable.
route_files: 
    car: "/Data_Processed/geodata/car_congestion_1d39c/car_congestion.parquet"
    walk: "/Data_Processed/geodata/walk-trips-1d39c.parquet"
    bike: "/Data_Processed/geodata/bike-lts-37721.parquet"
    transit: "/Data_Processed/geodata/transit-trips-7d58f.parquet"

# This is an output file, with the TBI trips and select route information saved. 
# it is stored relative to the local run directory. 
output_file_name: "data/tbi_full"  # saved as both csv and parquet