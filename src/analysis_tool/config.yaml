feasible_steps: 
    - WalkDistanceStep
    - WalkTimingStep
    - BikeDistanceStep
    - BikeSnowDepthStep
    - BikeHighLTSDistStep
    - BikeTimingStep
    - TransitReroutedStep
    - TransitAccessDistanceStep
    - TransitEgressDistanceStep
    - TransitWaitTimeStep
    - TransitTimingStep

probable_steps: 
    - WalkDurationDifferenceStep
    - BikeDurationDifferenceStep
    - TransitDurationDifferenceStep
    - BikeHighLTSDistStep
    - WalkPurposeStep
    - BikePurposeStep
    - TransitPurposeStep
    - TransitTransferCountStep
    - WalkPrecipitationStep
    - BikePrecipitationStep
    - WalkTemperatureStep
    - BikeTemperatureStep

fixed_purposes: ["Work", "Work-related", "Escort", "School", "School-related"]
unlikely_purposes: ["Escort", "Shop"]

# Optional raw numeric-input defaults, in each step's units, keyed by step class name.
# Omitted steps use the step's current effective cutoff converted to raw units.
default_raw_cutoffs: 
    WalkDistanceStep: 1.6
    BikeDistanceStep: 10
    BikeHighLTSDistStep: 0.15
    BikeSnowDepthStep: 0.0
    TransitAccessDistanceStep: 0.97
    TransitEgressDistanceStep: 0.93
    TransitWaitTimeStep: 64

build: False  # whether we are currently building to docker/streamlit; disables initialization/keyring
force_reinitialize: True
# save_result: False

# assumed to be in data/ directory
community_shape_file_name: "shp_bdry_census2020counties_ctus/Census2020CTUs.shp"
weather_file_name: "USW00014922.csv"
taz_terminal_time_file_name: "taz_terminal_times/TAZ3030_Terminal_times.shp"

keep_columns:
    - mode
    - o_purpose_category
    - d_purpose_category
    - gender
    - age
    - student_status
    - job_type
    - num_kids
    - travel_date
    - home_lon
    - home_lat
    - income_detailed
    - duration
    - distance
    - person_id
    - trip_id
    - wave
    - depart_time
    - arrive_time
    - travel_dow
    - vmt
    - vehicle_trips
    - o_lat
    - o_lon
    - d_lat
    - d_lon
    - trip_weight

scenario_columns:
    bike:
        # the format for scenarios is [title, new_column, replaced_column]
        - [default, None, None]
    transit:
        - [default, None, None]
    walk:
        - [default, None, None]
    car:
        - [default, None, None]

cold_start_threshold: 15


# One entry for each scenario
#   description: text description of the scenario
# 
#   These are inputs, stored on the network drive, as specified in the keyring variable: 
#       input_tbi_file: cleaned TBI file, as input to the whole process
#       car_route_file: car routes in parquet format, matched by trip_id
#       walk_route_file: walk routes in parquet format, matched by trip_id
#       bike_route_file: bike routes in parquet format, matched by trip_id
#       transit_route_file: transit routes in parquet format, matched by trip_id
#
#   These are outputs, which will be stored locally in the run folder.  
#   If the run detects the output file there, it will not overwrite it unless you force_reinitialize
#   This file should be stripped of any personally identifiable information, which would allow it to be 
#   shared on the cloud for ease of deployment. 
#       saved_tbi_file: matches the input TBI to the routes, and adds derived columns, must be parqeut or csv
scenario_to_run: "base"

scenarios: 
    base:
        description: "Base Scenario"
        input_tbi_file: "/data_processed/tbi_cleaned.csv" 
        car_route_file: "/Data_Processed/geodata/car_congestion_1d39c/car_congestion.parquet"
        walk_route_file: "/Data_Processed/geodata/walk-trips-1d39c.parquet"
        bike_route_file: "/Data_Processed/geodata/bike-lts-37721.parquet"
        transit_route_file: "/Data_Processed/geodata/transit-trips-45d51.parquet"
        saved_tbi_file: "data/tbi_base.csv"  
        saved_results: "output/trips_base.parquet"
        saved_options: "output/options_base.json"  
        saved_tables: "output/tables_base.json"
        
